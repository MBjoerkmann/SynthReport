name: Deploy to GCP

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/SynthReport
            BEFORE=$(git rev-parse HEAD)
            git pull origin main
            AFTER=$(git rev-parse HEAD)
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")

            SERVICES=""

            if echo "$CHANGED" | grep -q "^frontend/"; then
              SERVICES="$SERVICES frontend"
            fi

            if echo "$CHANGED" | grep -q "^Backend/"; then
              SERVICES="$SERVICES backend"
            fi

            if echo "$CHANGED" | grep -q "^nginx/"; then
              SERVICES="$SERVICES nginx"
            fi

            if echo "$CHANGED" | grep -q "^docker-compose.yml"; then
              SERVICES="frontend backend nginx"
            fi

            if [ -z "$SERVICES" ]; then
              echo "No service changes detected, skipping deploy."
              exit 0
            fi

            echo "Rebuilding:$SERVICES"
            docker compose up -d --build --no-deps $SERVICES
            docker image prune -f

            

